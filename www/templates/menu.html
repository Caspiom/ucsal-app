<ion-side-menus enable-menu-with-back-views="false">
  <ion-side-menu-content>
    <ion-nav-bar class="barra-ucsal">
      <ion-nav-back-button></ion-nav-back-button>
      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left" class="menu-lateral-ucsal">
    <ion-content>
      <div class="menu-cabecalho">
        <p class="menu-aluno-nome">{{ getAluno().nome }}</p>
        <p class="menu-aluno-matricula">Matrícula {{ getAluno().matricula }}</p>
      </div>
      <ion-list>
        <ion-item menu-close ui-sref="app.noticias">Notícias e Eventos</ion-item>
        <ion-item menu-close ui-sref="app.perfil">Atualização Cadastral</ion-item>
        <ion-item menu-close ui-sref="app.financeiro">Financeiro</ion-item>
        <ion-item menu-close ng-click="sair()">Sair</ion-item>
      </ion-list>
    </ion-content>
  </ion-side-menu>
</ion-side-menus>
