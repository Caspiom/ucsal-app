<ion-view view-title="Detalhe">
  <ion-content class="conteudo-pagina">
    <div class="card-publicacao" ng-if="publicacao">
      <div class="card-imagem">
        <img ng-src="{{ publicacao.imagem }}" alt="">
        <span class="selo selo-sobre-imagem" ng-class="{'selo-noticia': publicacao.categoria === 'Notícia', 'selo-evento': publicacao.categoria === 'Evento'}">{{ publicacao.categoria }}</span>
      </div>
      <div class="card-corpo">
        <p class="card-data"><i class="ion-ios-calendar-outline"></i> {{ publicacao.data | date:'dd/MM/yyyy' }}</p>
        <h2 class="card-titulo card-titulo-grande">{{ publicacao.titulo }}</h2>
        <p class="texto-completo">{{ publicacao.conteudo }}</p>
      </div>
    </div>

    <p class="aviso-vazio" ng-if="!publicacao">Publicação não encontrada.</p>
  </ion-content>
</ion-view>
