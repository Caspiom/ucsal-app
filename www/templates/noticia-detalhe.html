<ion-view view-title="Detalhe">
  <ion-content>
    <div class="card" ng-if="publicacao">
      <div class="item item-image">
        <img ng-src="{{ publicacao.imagem }}" alt="">
      </div>
      <div class="item item-body">
        <span class="selo" ng-class="{'selo-noticia': publicacao.categoria === 'Notícia', 'selo-evento': publicacao.categoria === 'Evento'}">{{ publicacao.categoria }}</span>
        <span class="card-data">{{ publicacao.data | date:'dd/MM/yyyy' }}</span>
        <h2 class="card-titulo">{{ publicacao.titulo }}</h2>
        <p class="texto-completo">{{ publicacao.conteudo }}</p>
      </div>
    </div>

    <p class="padding" ng-if="!publicacao">Publicação não encontrada.</p>
  </ion-content>
</ion-view>
