<ion-view view-title="Notícias e Eventos">
  <ion-content>
    <div class="filtro-categorias">
      <button class="button button-small" ng-class="{'filtro-ativo': filtro.categoria === ''}" ng-click="filtro.categoria = ''">Todas</button>
      <button class="button button-small" ng-class="{'filtro-ativo': filtro.categoria === 'Notícia'}" ng-click="filtro.categoria = 'Notícia'">Notícias</button>
      <button class="button button-small" ng-class="{'filtro-ativo': filtro.categoria === 'Evento'}" ng-click="filtro.categoria = 'Evento'">Eventos</button>
    </div>

    <div class="list card" ng-repeat="publicacao in publicacoes | filter:{ categoria: filtro.categoria }">
      <div class="item item-image">
        <img ng-src="{{ publicacao.imagem }}" alt="">
      </div>
      <div class="item item-body">
        <span class="selo" ng-class="{'selo-noticia': publicacao.categoria === 'Notícia', 'selo-evento': publicacao.categoria === 'Evento'}">{{ publicacao.categoria }}</span>
        <span class="card-data">{{ publicacao.data | date:'dd/MM/yyyy' }}</span>
        <h2 class="card-titulo">{{ publicacao.titulo }}</h2>
        <button class="button button-small botao-principal" ng-click="lerMais(publicacao)">Ler mais</button>
      </div>
    </div>
  </ion-content>
</ion-view>
