<ion-view view-title="Notícias e Eventos">
  <ion-content class="conteudo-pagina">
    <div class="filtro-categorias">
      <button class="filtro-botao" ng-class="{'filtro-ativo': filtro.categoria === ''}" ng-click="filtro.categoria = ''">Todas</button>
      <button class="filtro-botao" ng-class="{'filtro-ativo': filtro.categoria === 'Notícia'}" ng-click="filtro.categoria = 'Notícia'">Notícias</button>
      <button class="filtro-botao" ng-class="{'filtro-ativo': filtro.categoria === 'Evento'}" ng-click="filtro.categoria = 'Evento'">Eventos</button>
    </div>

    <div class="card-publicacao card-publicacao-lista" ng-repeat="publicacao in publicacoes | filter:{ categoria: filtro.categoria }">
      <img class="card-miniatura" ng-src="{{ publicacao.imagem }}" alt="">
      <div class="card-corpo card-corpo-lista">
        <div class="card-meta">
          <span class="selo" ng-class="{'selo-noticia': publicacao.categoria === 'Notícia', 'selo-evento': publicacao.categoria === 'Evento'}">{{ publicacao.categoria }}</span>
          <span class="card-data">{{ publicacao.data | date:'dd/MM/yyyy' }}</span>
        </div>
        <h2 class="card-titulo card-titulo-lista">{{ publicacao.titulo }}</h2>
        <button class="button button-small botao-principal botao-arredondado" ng-click="lerMais(publicacao)">Ler mais <i class="ion-ios-arrow-forward"></i></button>
      </div>
    </div>
  </ion-content>
</ion-view>
